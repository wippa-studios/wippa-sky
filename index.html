function drawFloorInterior(type, x, y, w, h, isNight, row, col) {
  const rng = mulberry32(row * 1000 + col * 7);
  // Every room gets a shallow floor plane, creating depth without turning the
  // construction grid into a perspective interface.
  const floor = ctx.createLinearGradient(x, y+h*.62, x, y+h);
  floor.addColorStop(0, 'rgba(7,17,30,.04)'); floor.addColorStop(1, 'rgba(2,8,18,.4)');
  ctx.fillStyle=floor; ctx.fillRect(x+3,y+h*.58,w-6,h*.38);
  ctx.strokeStyle='rgba(188,239,235,.09)'; ctx.lineWidth=.6;
  for(let i=0;i<3;i++){const ly=y+h*(.72+i*.08);ctx.beginPath();ctx.moveTo(x+5,ly);ctx.lineTo(x+w-5,ly);ctx.stroke();}
  switch (type) {
    case 'office': drawOffice(x,y,w,h,isNight,rng); break;
    case 'residence': drawResidence(x,y,w,h,isNight,rng); break;
    case 'hotel': drawHotel(x,y,w,h,isNight,rng); break;
    case 'shop': drawShop(x,y,w,h,isNight,rng); break;
    case 'restaurant': drawRestaurant(x,y,w,h,isNight,rng); break;
    case 'cinema': drawCinema(x,y,w,h,isNight,rng); break;
    case 'park': drawPark(x,y,w,h,isNight,rng); break;
    case 'spa': drawSpa(x,y,w,h,isNight,rng); break;
    case 'elevator': drawElevatorInterior(x,y,w,h); break;
    case 'lobby': drawLobby(x,y,w,h,isNight,rng); break;
  }
}

function drawOffice(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  // Ceiling lights
  for (let i = 0; i < 2; i++) {
    const lx = ix + iw*0.2 + i*iw*0.45;
    ctx.fillStyle = isNight ? 'rgba(255,255,230,0.6)' : 'rgba(255,255,255,0.12)';
    ctx.fillRect(lx, iy+1, iw*0.18, 1.5);
    if (isNight) {
      const lg = ctx.createRadialGradient(lx+iw*0.09, iy+2, 0, lx+iw*0.09, iy+2, iw*0.18);
      lg.addColorStop(0, 'rgba(255,255,200,0.1)'); lg.addColorStop(1, 'rgba(255,255,200,0)');
      ctx.fillStyle = lg; ctx.fillRect(lx-iw*0.1, iy, iw*0.38, ih*0.45);
    }
  }
  // Desks + monitors
  const deskY = iy+ih*0.55;
  for (let i = 0; i < 2; i++) {
    const dx = ix+iw*0.08+i*iw*0.48, dw = iw*0.32;
    ctx.fillStyle = '#92400e'; ctx.fillRect(dx, deskY, dw, ih*0.1);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(dx, deskY, dw, 1);
    ctx.fillStyle = '#78350f';
    ctx.fillRect(dx+1, deskY+ih*0.1, 1, ih*0.2);
    ctx.fillRect(dx+dw-2, deskY+ih*0.1, 1, ih*0.2);
    // Monitor
    const mw2 = dw*0.35, mh2 = ih*0.18;
    const mx2 = dx+dw*0.3, my2 = deskY-mh2+1;
    ctx.fillStyle = '#1e293b'; ctx.fillRect(mx2, my2, mw2, mh2);
    ctx.fillStyle = isNight ? 'rgba(100,180,255,0.45)' : 'rgba(100,180,255,0.2)';
    ctx.fillRect(mx2+1, my2+1, mw2-2, mh2-3);
    ctx.fillStyle = '#475569'; ctx.fillRect(mx2+mw2*0.4, my2+mh2, mw2*0.2, 2);
    // Chair
    ctx.fillStyle = '#334155';
    ctx.fillRect(dx+dw*0.35, deskY+ih*0.1+ih*0.15, iw*0.1, ih*0.08);
  }
  // Water cooler
  ctx.fillStyle = '#60a5fa'; ctx.fillRect(ix+iw*0.9, iy+ih*0.4, iw*0.06, ih*0.15);
  ctx.fillStyle = '#bfdbfe'; ctx.fillRect(ix+iw*0.9, iy+ih*0.35, iw*0.06, ih*0.08);
  // Plant
  ctx.fillStyle = '#15803d';
  ctx.beginPath(); ctx.arc(ix+3, iy+ih*0.45, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#713f12'; ctx.fillRect(ix+1.5, iy+ih*0.48, 2, ih*0.12);
}

function drawResidence(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  // Window
  const winW = iw*0.22, winH = ih*0.45;
  const winX = ix+iw*0.68, winY = iy+4;
  ctx.fillStyle = isNight ? '#0c1525' : '#87ceeb';
  ctx.fillRect(winX, winY, winW, winH);
  ctx.fillStyle = 'rgba(190,130,130,0.5)';
  ctx.fillRect(winX-2, winY-1, winW*0.18, winH+2);
  ctx.fillRect(winX+winW*0.82, winY-1, winW*0.18, winH+2);
  ctx.fillStyle = '#92400e'; ctx.fillRect(winX-3, winY-2, winW+6, 1.5);
  if (isNight) { ctx.fillStyle = 'rgba(255,220,100,0.12)'; ctx.fillRect(winX, winY, winW, winH); }
  // Bed
  const bedX = ix+iw*0.05, bedY = iy+ih*0.42, bedW = iw*0.45, bedH = ih*0.42;
  ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.roundRect(bedX, bedY, bedW, bedH, 2); ctx.fill();
  ctx.fillStyle = isNight ? '#6366f1' : '#818cf8';
  ctx.fillRect(bedX+1, bedY+bedH*0.3, bedW-2, bedH*0.7);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(bedX+1, bedY+bedH*0.3, bedW-2, 1.5);
  ctx.fillStyle = '#f1f5f9';
  ctx.beginPath(); ctx.roundRect(bedX+bedW*0.05, bedY+2, bedW*0.35, bedH*0.22, 3); ctx.fill();
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath(); ctx.roundRect(bedX+bedW*0.5, bedY+2, bedW*0.35, bedH*0.22, 3); ctx.fill();
  // Nightstand + lamp
  ctx.fillStyle = '#78350f'; ctx.fillRect(ix+iw*0.52, iy+ih*0.55, iw*0.1, ih*0.25);
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(ix+iw*0.54, iy+ih*0.47, iw*0.04, ih*0.08);
  if (isNight) {
    const lg = ctx.createRadialGradient(ix+iw*0.56, iy+ih*0.47, 0, ix+iw*0.56, iy+ih*0.47, iw*0.12);
    lg.addColorStop(0, 'rgba(251,191,36,0.15)'); lg.addColorStop(1, 'rgba(251,191,36,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(ix+iw*0.56, iy+ih*0.47, iw*0.12, 0, Math.PI*2); ctx.fill();
  }
  // Rug
  ctx.fillStyle = 'rgba(168,85,247,0.15)';
  ctx.beginPath(); ctx.roundRect(ix+iw*0.2, iy+ih*0.87, iw*0.4, ih*0.08, 2); ctx.fill();
}

function drawHotel(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  // Room sign
  ctx.fillStyle = '#1e293b'; ctx.fillRect(ix+1, iy+1, iw*0.12, ih*0.12);
  ctx.fillStyle = '#fbbf24'; ctx.font = `bold ${Math.max(5,ih*0.07)}px 'JetBrains Mono',monospace`; ctx.textAlign = 'center';
  ctx.fillText(`${100 + Math.floor(rng()*90)}`, ix+iw*0.06, iy+ih*0.09);
  // Bed
  const bedX = ix+iw*0.08, bedY = iy+ih*0.36, bedW = iw*0.48, bedH = ih*0.46;
  ctx.fillStyle = '#78350f'; ctx.fillRect(bedX, bedY-ih*0.05, bedW, ih*0.07);
  ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.roundRect(bedX, bedY, bedW, bedH, 3); ctx.fill();
  ctx.fillStyle = '#f1f5f9'; ctx.fillRect(bedX+2, bedY+bedH*0.2, bedW-4, bedH*0.8);
  ctx.fillStyle = '#e2e8f0'; ctx.fillRect(bedX+2, bedY+bedH*0.2, bedW-4, 1);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(bedX+4, bedY+3, bedW*0.35, bedH*0.18, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(bedX+bedW*0.45, bedY+3, bedW*0.35, bedH*0.18, 3); ctx.fill();
  // Nightstand
  ctx.fillStyle = '#78350f'; ctx.fillRect(ix+iw*0.58, iy+ih*0.5, iw*0.1, ih*0.28);
  ctx.fillStyle = '#1e293b'; ctx.fillRect(ix+iw*0.6, iy+ih*0.48, iw*0.06, ih*0.04);
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(ix+iw*0.62, iy+ih*0.38, iw*0.03, ih*0.1);
  if (isNight) {
    const lg = ctx.createRadialGradient(ix+iw*0.63, iy+ih*0.38, 0, ix+iw*0.63, iy+ih*0.38, iw*0.1);
    lg.addColorStop(0, 'rgba(251,191,36,0.12)'); lg.addColorStop(1, 'rgba(251,191,36,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(ix+iw*0.63, iy+ih*0.38, iw*0.1, 0, Math.PI*2); ctx.fill();
  }
  // Wardrobe
  ctx.fillStyle = '#78350f'; ctx.fillRect(ix+iw*0.78, iy+ih*0.18, iw*0.18, ih*0.62);
  ctx.fillStyle = '#92400e'; ctx.fillRect(ix+iw*0.78, iy+ih*0.18, iw*0.18, ih*0.02);
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(ix+iw*0.86, iy+ih*0.42, iw*0.02, ih*0.08);
}

function drawShop(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  // Shelves
  for (let s = 0; s < 3; s++) {
    const sy = iy+ih*0.08+s*ih*0.14;
    ctx.fillStyle = '#78350f'; ctx.fillRect(ix+iw*0.02, sy, iw*0.52, 1.5);
    for (let p = 0; p < 4; p++) {
      const px2 = ix+iw*0.04+p*iw*0.12;
      const cl = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#ec4899','#8b5cf6'];
      ctx.fillStyle = cl[(s*4+p)%cl.length];
      ctx.beginPath(); ctx.roundRect(px2, sy-ih*0.06-rng()*ih*0.03, iw*0.07, ih*0.06+rng()*ih*0.03, 1); ctx.fill();
    }
  }
  // Counter
  ctx.fillStyle = '#92400e'; ctx.fillRect(ix+iw*0.6, iy+ih*0.48, iw*0.35, ih*0.3);
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(ix+iw*0.6, iy+ih*0.48, iw*0.35, 1.5);
  // Register
  ctx.fillStyle = '#1e293b'; ctx.fillRect(ix+iw*0.7, iy+ih*0.44, iw*0.14, ih*0.06);
  ctx.fillStyle = '#4ade80'; ctx.fillRect(ix+iw*0.72, iy+ih*0.45, iw*0.1, ih*0.03);
  // SALE sign
  ctx.fillStyle = '#ef4444'; ctx.fillRect(ix+iw*0.68, iy+ih*0.04, iw*0.22, ih*0.12);
  ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(5,ih*0.06)}px 'Inter',sans-serif`; ctx.textAlign = 'center';
  ctx.fillText('SALE', ix+iw*0.79, iy+ih*0.12);
  // Bags
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(ix+iw*0.1, iy+ih*0.82, iw*0.06, ih*0.12);
  ctx.fillRect(ix+iw*0.18, iy+ih*0.85, iw*0.05, ih*0.1);
}

function drawRestaurant(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  // Pendant lights
  for (let i = 0; i < 2; i++) {
    const lx = ix+iw*0.25+i*iw*0.4;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(lx, iy+1); ctx.lineTo(lx, iy+ih*0.12); ctx.stroke();
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.moveTo(lx-iw*0.04, iy+ih*0.12); ctx.lineTo(lx+iw*0.04, iy+ih*0.12);
    ctx.lineTo(lx+iw*0.025, iy+ih*0.08); ctx.lineTo(lx-iw*0.025, iy+ih*0.08); ctx.closePath(); ctx.fill();
    if (isNight) {
      const lg = ctx.createRadialGradient(lx, iy+ih*0.14, 0, lx, iy+ih*0.14, iw*0.1);
      lg.addColorStop(0, 'rgba(251,191,36,0.12)'); lg.addColorStop(1, 'rgba(251,191,36,0)');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, iy+ih*0.14, iw*0.1, 0, Math.PI*2); ctx.fill();
    }
  }
  // Tables
  for (let t = 0; t < 2; t++) {
    const tx = ix+iw*0.2+t*iw*0.45, ty = iy+ih*0.55;
    ctx.fillStyle = '#f1f5f9';
    ctx.beginPath(); ctx.ellipse(tx, ty, iw*0.11, ih*0.055, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#78350f'; ctx.fillRect(tx-0.5, ty+ih*0.06, 1, ih*0.2);
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath(); ctx.arc(tx, ty-1, iw*0.035, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(tx, ty-1, iw*0.012, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#78350f';
    ctx.fillRect(tx-iw*0.07, ty+ih*0.03, iw*0.035, ih*0.1);
    ctx.fillRect(tx+iw*0.035, ty+ih*0.03, iw*0.035, ih*0.1);
  }
  // Wine rack
  ctx.fillStyle = '#78350f'; ctx.fillRect(ix+iw*0.82, iy+ih*0.12, iw*0.14, ih*0.5);
  for (let b = 0; b < 3; b++) {
    ctx.fillStyle = b%2===0 ? '#7c3aed' : '#dc2626';
    ctx.fillRect(ix+iw*0.84, iy+ih*0.15+b*ih*0.14, iw*0.1, ih*0.03);
  }
}

function drawCinema(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  // Screen
  const scrW = iw*0.4, scrH = ih*0.32;
  ctx.fillStyle = '#0f172a'; ctx.fillRect(ix+iw*0.3, iy+3, scrW, scrH);
  ctx.fillStyle = 'rgba(147,197,253,0.12)'; ctx.fillRect(ix+iw*0.3, iy+3, scrW, scrH);
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 0.5; ctx.strokeRect(ix+iw*0.3, iy+3, scrW, scrH);
  if (isNight) {
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.beginPath(); ctx.moveTo(ix+iw*0.5, iy+scrH+5);
    ctx.lineTo(ix+iw*0.3, iy+3); ctx.lineTo(ix+iw*0.3+scrW, iy+3); ctx.closePath(); ctx.fill();
  }
  // Seats
  for (let row2 = 0; row2 < 2; row2++) {
    const sy = iy+ih*0.48+row2*ih*0.2;
    for (let s = 0; s < 5; s++) {
      const sx = ix+iw*0.06+s*iw*0.17;
      ctx.fillStyle = '#dc2626';
      ctx.beginPath(); ctx.roundRect(sx, sy, iw*0.1, ih*0.12, 1); ctx.fill();
      ctx.fillStyle = '#b91c1c'; ctx.fillRect(sx, sy-ih*0.04, iw*0.1, ih*0.05);
    }
  }
  // Popcorn
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.moveTo(ix+iw*0.88, iy+ih*0.68); ctx.lineTo(ix+iw*0.95, iy+ih*0.68);
  ctx.lineTo(ix+iw*0.93, iy+ih*0.82); ctx.lineTo(ix+iw*0.9, iy+ih*0.82); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fef3c7';
  ctx.beginPath(); ctx.arc(ix+iw*0.915, iy+ih*0.66, iw*0.02, 0, Math.PI*2); ctx.fill();
}

function drawPark(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  ctx.fillStyle = '#166534'; ctx.fillRect(ix, iy+ih*0.68, iw, ih*0.28);
  ctx.fillStyle = '#15803d';
  for (let g = 0; g < 8; g++) {
    ctx.fillRect(ix+rng()*iw, iy+ih*0.7+rng()*ih*0.2, 1, 3);
  }
  const fc = ['#f472b6','#fbbf24','#c084fc','#fb923c'];
  for (let f = 0; f < 4; f++) {
    ctx.fillStyle = fc[f];
    ctx.beginPath(); ctx.arc(ix+iw*0.1+f*iw*0.25, iy+ih*0.73, 2, 0, Math.PI*2); ctx.fill();
  }
  for (let t = 0; t < 2; t++) {
    const tx = ix+iw*0.2+t*iw*0.5, ty = iy+ih*0.32;
    ctx.fillStyle = '#713f12'; ctx.fillRect(tx-1.5, ty+ih*0.1, 3, ih*0.25);
    ctx.fillStyle = '#15803d'; ctx.beginPath(); ctx.arc(tx, ty, iw*0.1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(tx-2, ty-2, iw*0.07, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4ade80'; ctx.beginPath(); ctx.arc(tx+2, ty-3, iw*0.05, 0, Math.PI*2); ctx.fill();
  }
  // Bench
  ctx.fillStyle = '#78350f'; ctx.fillRect(ix+iw*0.35, iy+ih*0.6, iw*0.3, 2);
  ctx.fillRect(ix+iw*0.36, iy+ih*0.62, 1.5, ih*0.06);
  ctx.fillRect(ix+iw*0.62, iy+ih*0.62, 1.5, ih*0.06);
  // Fountain
  ctx.fillStyle = '#60a5fa';
  ctx.beginPath(); ctx.ellipse(ix+iw*0.5, iy+ih*0.48+iw*0.04, iw*0.08, ih*0.035, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#94a3b8'; ctx.fillRect(ix+iw*0.5-1, iy+ih*0.4, 2, ih*0.08);
  ctx.fillStyle = 'rgba(147,197,253,0.5)';
  for (let d = 0; d < 3; d++) {
    ctx.beginPath(); ctx.arc(ix+iw*0.5-3+d*3, iy+ih*0.38-d*2, 1, 0, Math.PI*2); ctx.fill();
  }
}

function drawSpa(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  const ag = ctx.createRadialGradient(ix+iw*0.5, iy+ih*0.5, 0, ix+iw*0.5, iy+ih*0.5, iw*0.5);
  ag.addColorStop(0, 'rgba(251,191,36,0.05)'); ag.addColorStop(1, 'rgba(251,191,36,0)');
  ctx.fillStyle = ag; ctx.fillRect(ix, iy, iw, ih);
  // Massage bed
  ctx.fillStyle = '#f1f5f9';
  ctx.beginPath(); ctx.roundRect(ix+iw*0.15, iy+ih*0.38, iw*0.5, ih*0.35, 3); ctx.fill();
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath(); ctx.roundRect(ix+iw*0.16, iy+ih*0.4, iw*0.12, ih*0.08, 2); ctx.fill();
  // Candles
  for (let c2 = 0; c2 < 3; c2++) {
    const cx2 = ix+iw*0.75+c2*iw*0.07, cy2 = iy+ih*0.52;
    ctx.fillStyle = '#f5f5f4'; ctx.fillRect(cx2, cy2, iw*0.025, ih*0.12);
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.ellipse(cx2+iw*0.0125, cy2-ih*0.02, iw*0.012, ih*0.03, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.ellipse(cx2+iw*0.0125, cy2-ih*0.015, iw*0.005, ih*0.015, 0, 0, Math.PI*2); ctx.fill();
    const cg2 = ctx.createRadialGradient(cx2+iw*0.0125, cy2-ih*0.02, 0, cx2+iw*0.0125, cy2-ih*0.02, iw*0.06);
    cg2.addColorStop(0, 'rgba(251,191,36,0.08)'); cg2.addColorStop(1, 'rgba(251,191,36,0)');
    ctx.fillStyle = cg2; ctx.beginPath(); ctx.arc(cx2+iw*0.0125, cy2-ih*0.02, iw*0.06, 0, Math.PI*2); ctx.fill();
  }
  // Zen stones
  ctx.fillStyle = '#94a3b8';
  ctx.beginPath(); ctx.ellipse(ix+iw*0.08, iy+ih*0.78, iw*0.04, ih*0.03, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#64748b';
  ctx.beginPath(); ctx.ellipse(ix+iw*0.08, iy+ih*0.72, iw*0.03, ih*0.025, 0, 0, Math.PI*2); ctx.fill();
  // Steam
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
  for (let s2 = 0; s2 < 3; s2++) {
    ctx.beginPath(); ctx.moveTo(ix+iw*0.3+s2*iw*0.1, iy+ih*0.33);
    ctx.quadraticCurveTo(ix+iw*0.3+s2*iw*0.1+3, iy+ih*0.23, ix+iw*0.3+s2*iw*0.1-2, iy+ih*0.13);
    ctx.stroke();
  }
  // Bamboo
  ctx.fillStyle = '#65a30d'; ctx.fillRect(ix+iw*0.9, iy+ih*0.18, 2, ih*0.62);
  for (let b2 = 0; b2 < 3; b2++) {
    ctx.fillStyle = '#84cc16';
    ctx.beginPath(); ctx.ellipse(ix+iw*0.92, iy+ih*0.22+b2*ih*0.15, iw*0.03, ih*0.02, 0.3, 0, Math.PI*2); ctx.fill();
  }
}

function drawElevatorInterior(x, y, w, h) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(ix+iw*0.35, iy, iw*0.3, ih);
  ctx.strokeStyle = 'rgba(148,163,184,0.15)'; ctx.lineWidth = 0.5; ctx.setLineDash([3,3]);
  ctx.beginPath();
  ctx.moveTo(ix+iw*0.42, iy); ctx.lineTo(ix+iw*0.42, iy+ih);
  ctx.moveTo(ix+iw*0.58, iy); ctx.lineTo(ix+iw*0.58, iy+ih);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#1e293b'; ctx.fillRect(ix+iw*0.02, iy+ih*0.1, iw*0.12, ih*0.25);
  ctx.fillStyle = '#0f172a'; ctx.fillRect(ix+iw*0.03, iy+ih*0.12, iw*0.1, ih*0.2);
  for (let l = 0; l < 4; l++) {
    ctx.fillStyle = l===0 ? '#4ade80' : 'rgba(255,255,255,0.06)';
    ctx.beginPath(); ctx.arc(ix+iw*0.08, iy+ih*0.16+l*ih*0.05, 1.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(148,163,184,0.12)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(ix+iw*0.5, iy); ctx.lineTo(ix+iw*0.5, iy+ih); ctx.stroke();
}

function drawLobby(x, y, w, h, isNight, rng) {
  const iw = w-8, ih = h-8, ix = x+4, iy = y+4;
  // Tiles
  for (let tx = 0; tx < 4; tx++) for (let ty2 = 0; ty2 < 2; ty2++) {
    if ((tx+ty2)%2===0) { ctx.fillStyle = 'rgba(255,255,255,0.025)'; ctx.fillRect(ix+tx*iw*0.25, iy+ih*0.68+ty2*ih*0.14, iw*0.25, ih*0.14); }
  }
  // Reception
  ctx.fillStyle = '#1e293b'; ctx.fillRect(ix+iw*0.55, iy+ih*0.43, iw*0.4, ih*0.25);
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(ix+iw*0.55, iy+ih*0.43, iw*0.4, 1.5);
  ctx.fillStyle = '#fde68a';
  ctx.beginPath(); ctx.arc(ix+iw*0.75, iy+ih*0.36, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3b82f6'; ctx.fillRect(ix+iw*0.735, iy+ih*0.38, 3, ih*0.06);
  // Plants
  for (let p = 0; p < 2; p++) {
    const plx = ix+iw*0.05+p*iw*0.9;
    ctx.fillStyle = '#78350f'; ctx.fillRect(plx, iy+ih*0.58, iw*0.06, ih*0.15);
    ctx.fillStyle = '#15803d';
    ctx.beginPath(); ctx.arc(plx+iw*0.03, iy+ih*0.53, iw*0.05, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#22c55e';
    ctx.beginPath(); ctx.arc(plx+iw*0.03, iy+ih*0.5, iw*0.03, 0, Math.PI*2); ctx.fill();
  }
  // Sofa
  ctx.fillStyle = '#475569';
  ctx.beginPath(); ctx.roundRect(ix+iw*0.12, iy+ih*0.53, iw*0.25, ih*0.2, 3); ctx.fill();
  ctx.fillStyle = '#64748b'; ctx.fillRect(ix+iw*0.12, iy+ih*0.53, iw*0.25, 2);
  // Directory
  ctx.fillStyle = '#1e293b'; ctx.fillRect(ix+iw*0.02, iy+ih*0.08, iw*0.15, ih*0.35);
  ctx.fillStyle = '#fbbf24'; ctx.font = `bold ${Math.max(4,ih*0.06)}px 'Inter',sans-serif`; ctx.textAlign = 'left';
  ctx.fillText('DIR', ix+iw*0.04, iy+ih*0.15);
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.font = `${Math.max(3,ih*0.04)}px 'Inter',sans-serif`;
  ctx.fillText('1F Lobby', ix+iw*0.04, iy+ih*0.22);
  ctx.fillText('2F Offices', ix+iw*0.04, iy+ih*0.28);
  ctx.fillText('3F Shops', ix+iw*0.04, iy+ih*0.34);
}

// ── Minimap ──
function drawMinimap() {
  const mw = minimapCanvas.width, mh = minimapCanvas.height;
  minimapCtx.fillStyle = '#0f172a'; minimapCtx.fillRect(0, 0, mw, mh);
  const highest = getHighestFloor() + 2;
  const cellW2 = mw / COLS, cellH2 = mh / Math.max(highest + 1, 20);
  for (let r = 0; r <= highest; r++) for (let c = 0; c < COLS; c++) {
    const cell = state.tower[r] && state.tower[r][c];
    if (cell) {
      minimapCtx.fillStyle = COLORS.building[cell.type] || '#475569';
      minimapCtx.fillRect(c * cellW2, mh - (r + 1) * cellH2, cellW2 - 1, cellH2 - 1);
    }
  }
  const viewTop = Math.max(0, state.cameraY / (CELL_H * state.zoom));
  const viewH = canvas.height / (CELL_H * state.zoom);
  minimapCtx.strokeStyle = 'rgba(255,255,255,0.4)'; minimapCtx.lineWidth = 1;
  minimapCtx.strokeRect(1, mh - (viewTop + viewH) * cellH2, mw - 2, viewH * cellH2);
}

// ── HUD ──
function updateHUD() {
  document.getElementById('hud-money').textContent = '$' + state.money.toLocaleString();
  document.getElementById('hud-pop').textContent = state.population.toLocaleString();
  document.getElementById('hud-floors').textContent = getFloorCount();
  document.getElementById('hud-rating').textContent = '★'.repeat(state.rating);
  document.getElementById('date-day').textContent = `Day ${state.day}`;
  document.getElementById('date-period').textContent = state.dayPhase.charAt(0).toUpperCase() + state.dayPhase.slice(1);
}

function addLog(text, type = '') {
  const log = document.getElementById('event-log');
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.innerHTML = `<span class="time">${state.dayPhase.slice(0,3).toUpperCase()}</span>${text}`;
  log.appendChild(entry);
  if (log.children.length > 30) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

function showToast(text, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = text;
  document.getElementById('game-container').appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ── Achievements ──
const ACHIEVEMENTS = {
  first_build: { icon: '🏗️', name: 'First Floor' },
  ten_floors: { icon: '🏢', name: 'Rising Tower' },
  twenty_floors: { icon: '🌆', name: 'Skyline Builder' },
  fifty_floors: { icon: '🏙️', name: 'Tower Titan' },
  hundred_floors: { icon: '👑', name: 'Sky Master' },
  first_resident: { icon: '🏠', name: 'Home Sweet Home' },
  pop_10: { icon: '👥', name: 'Small Community' },
  pop_50: { icon: '🏘️', name: 'Growing Town' },
  pop_100: { icon: '🌆', name: 'Bustling City' },
  first_cinema: { icon: '🎬', name: 'Entertainment Hub' },
  first_spa: { icon: '🧖', name: 'Luxury Living' },
  first_park: { icon: '🌳', name: 'Green Space' },
  five_star: { icon: '⭐', name: 'Five Star Rating' },
  rich: { icon: '💎', name: 'Millionaire' },
};

function checkAchievements() {
  const fc = getFloorCount();
  const unlocks = [];
  if (fc >= 1) unlocks.push('first_build');
  if (fc >= 10) unlocks.push('ten_floors');
  if (fc >= 20) unlocks.push('twenty_floors');
  if (fc >= 50) unlocks.push('fifty_floors');
  if (fc >= 100) unlocks.push('hundred_floors');
  if (state.population > 0) unlocks.push('first_resident');
  if (state.population >= 10) unlocks.push('pop_10');
  if (state.population >= 50) unlocks.push('pop_50');
  if (state.population >= 100) unlocks.push('pop_100');
  if (state.rating >= 5) unlocks.push('five_star');
  if (state.money >= 1000000) unlocks.push('rich');

  for (let r = 0; r < MAX_FLOORS; r++) for (let c = 0; c < COLS; c++) {
    const cell = state.tower[r][c];
    if (cell) {
      if (cell.type === 'cinema') unlocks.push('first_cinema');
      if (cell.type === 'spa') unlocks.push('first_spa');
      if (cell.type === 'park') unlocks.push('first_park');
    }
  }

  unlocks.forEach(id => {
    if (!state.achievementsUnlocked.has(id) && ACHIEVEMENTS[id]) {
      state.achievementsUnlocked.add(id);
      showAchievement(ACHIEVEMENTS[id]);
    }
  });
}

function showAchievement(ach) {
  const popup = document.getElementById('achievement-popup');
  document.getElementById('ach-icon').textContent = ach.icon;
  document.getElementById('ach-name').textContent = ach.name;
  popup.classList.add('show');
  sfxAchievement();
  addLog(`🏆 Achievement: ${ach.name}`, 'warning');
  setTimeout(() => popup.classList.remove('show'), 2500);
}

// ── Info Panel ──
function showInfoPanel(row, col) {
  const cell = state.tower[row] && state.tower[row][col];
  if (!cell) { closeInfoPanel(); return; }
  const ft = FLOOR_TYPES[cell.type];
  if (!ft) return;
  document.getElementById('info-title').textContent = `${ft.icon} ${ft.name} — Floor ${row + 1}`;
  document.getElementById('info-content').innerHTML = `
    <div class="info-row"><span class="label">Type</span><span class="value">${ft.name}</span></div>
    <div class="info-row"><span class="label">Income</span><span class="value" style="color:#4ade80">$${ft.income}/day</span></div>
    <div class="info-row"><span class="label">Capacity</span><span class="value">${cell.occupancy}/${ft.capacity}</span></div>
    <div class="info-row"><span class="label">Satisfaction</span><span class="value" style="color:#fbbf24">${Math.round(state.satisfaction)}%</span></div>
    ${ft.popAdd > 0 ? `<div class="info-row"><span class="label">Population</span><span class="value" style="color:#60a5fa">+${ft.popAdd}</span></div>` : ''}
    <div class="info-row"><span class="label">Built</span><span class="value">Day ${cell.built}</span></div>`;
  document.getElementById('info-panel').classList.add('visible');
}
function closeInfoPanel() { document.getElementById('info-panel').classList.remove('visible'); }

// ── Input ──
let isDragging = false, dragStartY = 0, dragStartCamY = 0;
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) { isDragging = true; dragStartY = e.clientY; dragStartCamY = state.cameraY; }
});
canvas.addEventListener('mousemove', e => {
  if (isDragging && state.selectedTool === 'select') {
    state.cameraY = Math.max(0, dragStartCamY + (dragStartY - e.clientY));
  }
  state.hoveredCell = screenToCell(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', e => {
  if (isDragging && Math.abs(e.clientY - dragStartY) < 5) {
    const cell = screenToCell(e.clientX, e.clientY);
    if (cell) {
      if (state.selectedTool === 'select') { showInfoPanel(cell.row, cell.col); sfxClick(); }
      else if (state.selectedTool === 'demolish') demolishFloor(cell.row, cell.col);
      else buildFloor(cell.row, cell.col, state.selectedTool);
    }
  }
  isDragging = false;
});
canvas.addEventListener('wheel', e => { state.cameraY = Math.max(0, state.cameraY + e.deltaY * 0.8); });

document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.selectedTool = btn.dataset.tool;
    sfxClick();
    closeInfoPanel();
  });
});
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.speed = parseInt(btn.dataset.speed);
    sfxClick();
  });
});
minimapCanvas.addEventListener('click', e => {
  const rect = minimapCanvas.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const ratio = y / minimapCanvas.height;
  const highest = getHighestFloor() + 2;
  state.cameraY = Math.max(0, (1 - ratio) * highest * CELL_H * state.zoom - canvas.height / 2);
});

document.addEventListener('keydown', e => {
  if (e.key === '1') document.querySelector('[data-tool="office"]').click();
  if (e.key === '2') document.querySelector('[data-tool="residence"]').click();
  if (e.key === '3') document.querySelector('[data-tool="hotel"]').click();
  if (e.key === '4') document.querySelector('[data-tool="shop"]').click();
  if (e.key === '5') document.querySelector('[data-tool="restaurant"]').click();
  if (e.key === '6') document.querySelector('[data-tool="cinema"]').click();
  if (e.key === '7') document.querySelector('[data-tool="park"]').click();
  if (e.key === '8') document.querySelector('[data-tool="spa"]').click();
  if (e.key === 'e') document.querySelector('[data-tool="elevator"]').click();
  if (e.key === 'd' || e.key === 'Delete') document.querySelector('[data-tool="demolish"]').click();
  if (e.key === 's') document.querySelector('[data-tool="select"]').click();
  if (e.key === ' ') { e.preventDefault(); document.querySelector('[data-speed="1"]').click(); }
  if (e.key === 'Escape') closeInfoPanel();
  if (e.key === 'ArrowUp') state.cameraY = Math.max(0, state.cameraY - 80);
  if (e.key === 'ArrowDown') state.cameraY += 80;
});

// ── Main Loop ──
let lastTime = 0;
initTower();
resize();

buildFloor(1, 1, 'shop');
buildFloor(1, 2, 'restaurant');
buildFloor(1, 3, 'office');
buildFloor(1, 5, 'office');
buildFloor(1, 6, 'shop');
buildFloor(1, 7, 'residence');
buildFloor(2, 1, 'office');
buildFloor(2, 2, 'residence');
buildFloor(2, 3, 'residence');
buildFloor(2, 5, 'residence');
buildFloor(2, 6, 'office');
buildFloor(2, 7, 'office');
state.money = 500000;
state.cameraY = 0;
updateEconomy();

addLog('🏗️ Welcome to Wippa Sky!', 'info');
addLog('💡 Select a tool, then click the tower to build.', 'info');
addLog('🔑 Keys 1-8: tools • Arrows: scroll • Space: pause', 'info');

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  state.tick += dt * state.speed;

  updateDayCycle(dt);
  updateSky(dt);
  updateTenants(dt);
  updateElevators(dt);
  updateParticles(dt);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawSky();
  drawBackgroundCity();
  drawGround();
  drawTower();
  drawMinimap();
  updateHUD();

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
